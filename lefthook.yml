pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true
    go-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD
    astro-check:
      glob: "*.{astro,ts,tsx}"
      run: pnpm --dir web exec astro check

pre-push:
  parallel: true
  commands:
    go-lint:
      run: golangci-lint run
    go-test:
      run: mise run test
    api-contract:
      run: mise run test-api
    web-test:
      run: pnpm --dir web test
