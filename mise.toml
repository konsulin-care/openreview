[tools]
go = "1.27.3"
node = "26"
pnpm = "12"
golangci-lint = "2.13"

[tasks]
test = "go test ./..."
lint = "golangci-lint run"
build = "go build -o bin/openreview ./cmd/openreview"
app = "mise run build && ./bin/openreview --web-ui"
dev-backend = "go run ./cmd/openreview"
dev-frontend = "cd web && pnpm dev"
fmt = "go fmt ./..."
