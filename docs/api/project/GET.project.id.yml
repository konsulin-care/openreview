info:
  name: get project by id
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/project/{{project_id}}"
  header:
    - name: Content-Type
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
    - expression: res.body.name
      operator: isString
    - expression: res.body.path
      operator: isString
  scripts:
    - type: tests
      code: |-
        test("project by id: returns project details", function() {
          expect(res.body.id).to.be.a("string");
          expect(res.body.name).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });
    - type: postrequest
      code: |-
        bru.setNextRequest("get actor");
