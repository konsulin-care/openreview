info:
  name: delete projects
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/project"
  header:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {"ids": {{batchProjectIds}}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.deleted.length
      operator: eq
      value: "2"
    - expression: res.body.errors.length
      operator: eq
      value: "0"
  scripts:
    - type: before-request
      code: |-
        const base = bru.getEnvVar("baseUrl");
        const ids = [];

        const resp1 = await bru.sendRequest({
          method: "POST",
          url: `${base}/api/v1/project`,
          headers: { "Content-Type": "application/json" },
          data: { name: "batch-test-1", status: "active" }
        }, function(err, res) {
          if (!err) ids.push(res.data.project_id);
        });

        const resp2 = await bru.sendRequest({
          method: "POST",
          url: `${base}/api/v1/project`,
          headers: { "Content-Type": "application/json" },
          data: { name: "batch-test-2", status: "active" }
        }, function(err, res) {
          if (!err) ids.push(res.data.project_id);
        });

        bru.setVar("batchProjectIds", JSON.stringify(ids));
    - type: tests
      code: |-
        test("delete projects: deletes 2 projects", function() {
          expect(res.body.deleted).to.be.an("array");
          expect(res.body.deleted.length).to.equal(2);
          expect(res.body.errors).to.be.an("array");
          expect(res.body.errors.length).to.equal(0);
        });
    - type: after-response
      code: |-
        bru.runner.setNextRequest(null);
