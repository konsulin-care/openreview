info:
  name: initialize
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/initialize"
  header:
    - name: Content-Type
      value: application/json
  body:
    mode: raw
    raw: |
      {
        "name": "{{actorName}}",
        "email": "{{actorEmail}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.actor_id
      operator: isString
    - expression: res.body.state
      operator: eq
      value: "READY"
  scripts:
    - type: prerequest
      code: |-
        bru.setVar("actorName", "Test User");
        bru.setVar("actorEmail", "test@example.com");
    - type: tests
      code: |-
        test("initialize: returns actor_id and READY state", function() {
          expect(res.body.actor_id).to.be.a("string");
          expect(res.body.actor_id.length).to.equal(26);
          expect(res.body.state).to.equal("READY");
        });
        test("initialize: chains to get actor", function() {
          bru.runner.setNextRequest("get actor");
        });
