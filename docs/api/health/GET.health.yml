info:
  name: health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/health"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: "ok"
  scripts:
    - type: tests
      code: |- 
        test("health: returns ok", function() {
          expect(res.body.status).to.equal("ok");
        });
        test("health: chains to status", function() {
          bru.runner.setNextRequest("status");
        });
