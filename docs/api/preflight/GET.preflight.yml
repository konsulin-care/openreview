info:
  name: preflight
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/preflight"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.git
      operator: isString
    - expression: res.body.mise
      operator: isString
  scripts:
    - type: tests
      code: |-
        test("preflight: git field is string or null", function() {
          expect(typeof res.body.git === "string" || res.body.git === null).to.be.true;
        });
        test("preflight: mise field is string or null", function() {
          expect(typeof res.body.mise === "string" || res.body.mise === null).to.be.true;
        });
    - type: after-response
      code: |-
        bru.runner.setNextRequest("initialize");
