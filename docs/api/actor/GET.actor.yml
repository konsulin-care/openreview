info:
  name: get actor
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/actor"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
    - expression: res.body.name
      operator: isString
    - expression: res.body.email
      operator: isString
  scripts:
    - type: tests
      code: |-
        test("get actor: returns id, name, and email", function() {
          expect(res.body.id).to.be.a("string");
          expect(res.body.id.length).to.equal(26);
          expect(res.body.name).to.be.a("string");
          expect(res.body.email).to.be.a("string");
        });
    - type: after-response
      code: |-
        bru.runner.setNextRequest("put actor");
